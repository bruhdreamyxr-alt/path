name: Build and release

# Windows-only: the macOS build was removed, so one job now covers the whole
# release. (There used to be a macOS job and a Windows job in one workflow,
# because a Release can only be created once - two workflows triggered on the
# same tag would race for it.)
#
# Triggers:
#   * a version tag, e.g. v2.1.0 - build and attach the results to a Release.
#     That Release is what installed copies self-update from.
#   * the "Run workflow" button - build everything, keep it as artifacts only.
#
# Python 3.14 - every pin resolves to a cp314 win_amd64 wheel, which is the
# interpreter the Windows app is built and tested with locally.

on:
  workflow_dispatch:      # the "Run workflow" button
  push:
    tags:
      - 'v*'              # build + publish a Release on version tags

permissions:
  contents: write         # needed to attach files to a Release

env:
  # Exact patch version, deliberately - a bare '3.14' resolves to whatever patch
  # is newest that week, so two builds of the same commit can silently differ.
  # Wheels are tagged per minor version, so the pins in requirements.txt are
  # unaffected by a patch bump.
  PYTHON_WINDOWS: '3.14.7'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_WINDOWS }}

      - name: Show the build environment
        shell: pwsh
        run: |
          Write-Host "runner:     $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "Python:     $(python -V 2>&1)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "ISCC:       (installed in the next step)"
          Get-PSDrive C | Select-Object Used, Free | Format-List

      - name: Install Inno Setup
        # Compiles the .exe installer. ISCC.exe lands in "Inno Setup 6" under
        # Program Files (x86), which tools/build_windows.ps1 auto-detects.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::ISCC.exe not found at $iscc after installing innosetup"
            exit 1
          }
          Write-Host "ISCC: $iscc"

      - name: Build the app, the update ZIP and the installer
        # Deliberately one script: it is the same one you run locally, so a
        # release built here is produced by the exact steps you can reproduce.
        # It installs dependencies, fetches the helper binaries (they are too
        # large to commit), runs the test suite, builds updater_cli.exe, the
        # app, the self-update ZIP and the installer.
        shell: pwsh
        run: pwsh -NoProfile -File tools/build_windows.ps1

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name | Format-Table -AutoSize
          Get-ChildItem mysetup*.exe | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name | Format-Table -AutoSize

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAudioStudio-Windows-installer
          path: mysetup*.exe
          if-no-files-found: error

      - name: Upload the self-update ZIP
        # This is the file installed copies download by themselves; the name's
        # "_update.zip" suffix is what updater.py looks for in a Release.
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAudioStudio-Windows-update-zip
          path: dist/*_update.zip
          if-no-files-found: error

  release:
    # Only for a tag, and only once every platform has built: a Release missing
    # one platform would leave those users with no way to get the new version.
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        # Only needed to read version.py. Without it the bare `python` command
        # does not reliably exist on ubuntu-latest, and this check - the last
        # step before publishing - would fail after a full build.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_WINDOWS }}

      - name: Check the tag matches version.py
        # The artifact filenames come from version.py while the Release is named
        # after the tag. If they disagree you would publish "2.1.0" containing
        # files called 2.0.0, and installed copies would compare themselves
        # against a version number that never shipped.
        run: |
          VERSION="$(python tools/get_version.py)"
          TAG="${{ github.ref_name }}"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match version.py ('$VERSION'). Bump version.py, or tag v${VERSION}."
            exit 1
          fi
          echo "tag $TAG matches version.py $VERSION"

      - name: Download every build artifact
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: List what will be published
        run: ls -lh release-files

      - name: Write the legacy Google Drive manifest
        # One last trip through the old update channel. Copies of 2.0.0 and
        # earlier read a manifest from a fixed Google Drive file and download
        # whichever ZIP it names; this writes that manifest, pointing at the ZIP
        # attached a moment later. The old app then fetches the new build
        # straight from GitHub, so the only thing that ever has to go to Drive
        # again is this ~120 byte JSON file (see RELEASE.md for the few clicks).
        run: |
          python tools/make_update_manifest.py \
            --release-dir release-files \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}"

      - name: Attach everything to a Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body: |
            Universal Audio Studio ${{ github.ref_name }}.

            * `mysetup*.exe` — the installer. Run it and the app is ready to go.
            * `UniversalAudioStudio_*_update.zip` — used only by the in-app
              updater. You do not need to download it: copies of 2.0.0 and later
              find it here on their own.

            Installed copies check this Release automatically and update
            themselves.

# Google Drive is being retired rather than mirrored to - see RELEASE.md.
