name: Build and release

# One workflow rather than one per platform, because a Release can only be
# created once: if a macOS workflow and a Windows workflow both triggered on the
# same tag they would race for it, and the loser's files would silently be
# missing from the Release.
#
# Triggers:
#   * a version tag, e.g. v2.1.0 - build every platform and attach the results
#     to a Release. That Release is what installed copies self-update from.
#   * the "Run workflow" button - build everything, keep it as artifacts only.
#
# The Python version differs per platform for a concrete reason:
#   macOS   3.13 - pedalboard publishes no cp314 macOS x86_64 wheel (checked
#                  against PyPI for 0.9.23 and 0.9.25), so 3.14 could only ever
#                  build the Apple Silicon app. 3.13 has wheels for both Mac
#                  architectures. tools/check_mac_wheels.py enforces this.
#   Windows 3.14 - every pin resolves to a cp314 win_amd64 wheel, which is the
#                  interpreter the Windows app is built and tested with locally.

on:
  workflow_dispatch:      # the "Run workflow" button
  push:
    tags:
      - 'v*'              # build + publish a Release on version tags

permissions:
  contents: write         # needed to attach files to a Release

env:
  # Exact patch versions, deliberately - a bare '3.13'/'3.14' resolves to
  # whatever patch is newest that week, so two builds of the same commit can
  # silently differ. Both of these have macOS arm64 + x64 and win64 builds
  # (checked against actions/python-versions), and wheels are tagged per minor
  # version, so the pins in requirements.txt are unaffected by a patch bump.
  PYTHON_MACOS: '3.13.15'
  PYTHON_WINDOWS: '3.14.7'

jobs:
  build-macos:
    strategy:
      # One architecture failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          # macos-15 is Apple Silicon. macos-14 is deprecated (unsupported from
          # November 2026), so it is no longer used.
          - runner: macos-15
            arch: arm64
            label: apple-silicon
          # macos-15-intel is the standard Intel (x86_64) macOS runner.
          - runner: macos-15-intel
            arch: x86_64
            label: intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_MACOS }}

      - name: Show the build environment
        run: |
          echo "runner:  ${{ matrix.runner }}  (${{ matrix.arch }})"
          echo "macOS:   $(sw_vers -productVersion)   arch: $(uname -m)"
          echo "Python:  $(python -V 2>&1)   at: $(command -v python)"
          echo "bash:    $BASH_VERSION"
          echo "curl:    $(curl --version | head -n1)"
          echo "unzip:   $(command -v unzip || echo MISSING)"
          echo "codesign: $(command -v codesign || echo MISSING)"
          df -h . | tail -n1

      - name: Check every pin has a macOS wheel
        # Catches an uninstallable pin in ~20 seconds with a short readable
        # list, instead of an opaque "Process completed with exit code N".
        run: |
          python tools/check_mac_wheels.py \
            --python "$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" \
            --arch "${{ matrix.arch }}"

      - name: Build .app and .dmg
        run: bash tools/build_macos.sh

      - name: Show what was produced
        run: |
          ls -lh dist/
          du -sh dist/UniversalAudioStudio.app

      - name: Upload the .dmg as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAudioStudio-macOS-${{ matrix.label }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_WINDOWS }}

      - name: Show the build environment
        shell: pwsh
        run: |
          Write-Host "runner:     $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "Python:     $(python -V 2>&1)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "ISCC:       (installed in the next step)"
          Get-PSDrive C | Select-Object Used, Free | Format-List

      - name: Install Inno Setup
        # Compiles the .exe installer. ISCC.exe lands in "Inno Setup 6" under
        # Program Files (x86), which tools/build_windows.ps1 auto-detects.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::ISCC.exe not found at $iscc after installing innosetup"
            exit 1
          }
          Write-Host "ISCC: $iscc"

      - name: Build the app, the update ZIP and the installer
        # Deliberately one script: it is the same one you run locally, so a
        # release built here is produced by the exact steps you can reproduce.
        # It installs dependencies, fetches the helper binaries (they are too
        # large to commit), runs the test suite, builds updater_cli.exe, the
        # app, the self-update ZIP and the installer.
        shell: pwsh
        run: pwsh -NoProfile -File tools/build_windows.ps1

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name | Format-Table -AutoSize
          Get-ChildItem mysetup*.exe | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name | Format-Table -AutoSize

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAudioStudio-Windows-installer
          path: mysetup*.exe
          if-no-files-found: error

      - name: Upload the self-update ZIP
        # This is the file installed copies download by themselves; the name's
        # "_update.zip" suffix is what updater.py looks for in a Release.
        uses: actions/upload-artifact@v7
        with:
          name: UniversalAudioStudio-Windows-update-zip
          path: dist/*_update.zip
          if-no-files-found: error

  release:
    # Only for a tag, and only once every platform has built: a Release missing
    # one platform would leave those users with no way to get the new version.
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        # Only needed to read version.py. Without it the bare `python` command
        # does not reliably exist on ubuntu-latest, and this check - the last
        # step before publishing - would fail after a full build.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_MACOS }}

      - name: Check the tag matches version.py
        # The artifact filenames come from version.py while the Release is named
        # after the tag. If they disagree you would publish "2.1.0" containing
        # files called 2.0.0, and installed copies would compare themselves
        # against a version number that never shipped.
        run: |
          VERSION="$(python tools/get_version.py)"
          TAG="${{ github.ref_name }}"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match version.py ('$VERSION'). Bump version.py, or tag v${VERSION}."
            exit 1
          fi
          echo "tag $TAG matches version.py $VERSION"

      - name: Download every build artifact
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: List what will be published
        run: ls -lh release-files

      - name: Write the legacy Google Drive manifest
        # One last trip through the old update channel. Copies of 2.0.0 and
        # earlier read a manifest from a fixed Google Drive file and download
        # whichever ZIP it names; this writes that manifest, pointing at the ZIP
        # attached a moment later. The old app then fetches the new build
        # straight from GitHub, so the only thing that ever has to go to Drive
        # again is this ~120 byte JSON file (see RELEASE.md for the few clicks).
        run: |
          python tools/make_update_manifest.py \
            --release-dir release-files \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}"

      - name: Attach everything to a Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body: |
            Universal Audio Studio ${{ github.ref_name }}.

            ### Windows

            * `mysetup*.exe` — the installer. Run it and the app is ready to go.
            * `UniversalAudioStudio_*_update.zip` — used only by the in-app
              updater. You do not need to download it: copies of 2.0.0 and later
              find it here on their own.

            ### macOS

            * `...-arm64.dmg` — Apple Silicon (M1/M2/M3/M4; any Mac from late 2020 on)
            * `...-x86_64.dmg` — Intel

            Open the `.dmg`, drag UniversalAudioStudio onto Applications, then
            launch it once using **right-click -> Open -> Open**. The app is
            ad-hoc signed rather than notarised, so macOS warns about an
            unidentified developer the first time only. Terminal equivalent:

                xattr -dr com.apple.quarantine /Applications/UniversalAudioStudio.app

            Windows copies check this Release automatically and update themselves.

# Google Drive is being retired rather than mirrored to - see RELEASE.md.
